site_name: pydd
site_description: Dump-and-die debugging for FastAPI, Flask, and Django — beautiful HTML pages.
site_url: https://ardavanshamroshan.github.io/pydd/
repo_url: https://github.com/ardavanshamroshan/pydd
repo_name: ardavanshamroshan/pydd
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

copyright: Copyright &copy; 2026 Ardavan — MIT License

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  logo: assets/images/logo-mark.png
  favicon: assets/images/logo-mark.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Figtree
    code: JetBrains Mono
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - en
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
          theme:
            language: en
        - locale: fa
          name: فارسی
          build: true
          theme:
            language: fa
          nav_translations:
            Home: خانه
            Getting Started: شروع کار
            Installation: نصب
            Features: امکانات
            Frameworks: فریم‌ورک‌ها
            FastAPI: FastAPI
            Flask: Flask
            Django: Django
            API Reference: مرجع API
            Live Demo: دموی زنده
            Upgrade Guide: راهنمای ارتقا
            Changelog: تغییرات

extra_css:
  - stylesheets/nova.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ardavanshamroshan/pydd
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pydd-web/
  alternate:
    - name: English
      link: /
      lang: en
    - name: فارسی
      link: /fa/
      lang: fa

nav:
  - Home: index.md
  - Getting Started:
      - Getting Started: getting-started.md
      - Installation: installation.md
  - Features: features.md
  - Frameworks:
      - FastAPI: frameworks/fastapi.md
      - Flask: frameworks/flask.md
      - Django: frameworks/django.md
  - API Reference: api.md
  - Live Demo: demo.md
  - Upgrade Guide: upgrade.md
  - Changelog: changelog.md
