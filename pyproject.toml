[project]
name = "pydd-web"
version = "0.2.4"
description = "Dump-and-die for web frameworks (FastAPI, Flask, Django) — HTML dumps on top of pydump-dd"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ardavan" }]
keywords = ["debug", "dump", "dd", "fastapi", "flask", "django"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: FastAPI",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "pydump-dd>=0.2.4",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100.0"]
flask = ["flask>=2.3.0"]
django = ["django>=4.2"]
all = ["fastapi>=0.100.0", "flask>=2.3.0", "django>=4.2"]
dev = ["pytest>=8.0.0", "fastapi[standard]>=0.100.0", "httpx>=0.27.0"]

[project.urls]
Homepage = "https://ardavanshamroshan.github.io/pydd/"
Documentation = "https://ardavanshamroshan.github.io/pydd/"
Repository = "https://github.com/ardavanshamroshan/pydd"
Issues = "https://github.com/ardavanshamroshan/pydd/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pydd"]

[tool.hatch.build.targets.sdist]
include = ["src/pydd", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
